# Test-only profile: in-memory H2 instead of a live MySQL connection.
# Used by @ActiveProfiles("test") so `mvn test` never needs Docker/Podman/MySQL running.

spring.datasource.url=jdbc:h2:mem:inventory_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
