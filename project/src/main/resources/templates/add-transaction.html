<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Transaction</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Add Stock Transaction</h1>

<form th:action="@{/transactions}" th:object="${transaction}" method="post">

    <label>Product:</label><br>
    <select th:field="*{product}" required>
        <option value="">-- Select Product --</option>
        <option th:each="product : ${products}"
                th:value="${product.productId}"
                th:text="${product.name}">
        </option>
    </select>
    <br><br>

    <label>Supplier:</label><br>
    <select th:field="*{supplier}" required>
        <option value="">-- Select Supplier --</option>
        <option th:each="supplier : ${suppliers}"
                th:value="${supplier.supplierId}"
                th:text="${supplier.name}">
        </option>
    </select>
    <br><br>

    <label>Type:</label><br>
    <div class="radio-group">
        <label>
            <input type="radio" th:field="*{transactionType}" value="STOCK_IN"> Stock In
        </label>
        <label>
            <input type="radio" th:field="*{transactionType}" value="STOCK_OUT"> Stock Out
        </label>
    </div>

    <label>Quantity:</label><br>
    <input type="number" th:field="*{quantity}" required>
    <br><br>

    <button type="submit">Save Transaction</button>

</form>

<br>

<a th:href="@{/transactions}">
    Back to Transactions
</a>

</body>
</html>
