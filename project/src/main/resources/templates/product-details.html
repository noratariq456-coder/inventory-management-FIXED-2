<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Product Details</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Product Details</h1>

<p><strong>ID:</strong> <span th:text="${product.productId}"></span></p>

<p><strong>Name:</strong> <span th:text="${product.name}"></span></p>

<p><strong>SKU:</strong> <span th:text="${product.sku}"></span></p>

<p><strong>Price:</strong> <span th:text="${product.price}"></span></p>

<p><strong>Category:</strong> <span th:text="${product.category.name}"></span></p>

<p><strong>Quantity:</strong> <span th:text="${currentStock}"></span></p>

<p><strong>Suppliers:</strong>
    <span th:text="${#strings.listJoin(suppliers.![name], ', ')}"></span>
</p>

<br>

<a th:href="@{/products}">
    Back to Products
</a>

</body>
</html>
