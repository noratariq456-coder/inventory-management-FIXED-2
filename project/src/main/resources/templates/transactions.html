<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Transactions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Stock Transactions</h1>

<a th:href="@{/transactions/add}">
    <button>Add Transaction</button>
</a>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Product</th>
        <th>Supplier</th>
        <th>Type</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>

    <tr th:each="transaction : ${transactions}">
        <td th:text="${transaction.transactionId}"></td>
        <td th:text="${transaction.product.name}"></td>
        <td th:text="${transaction.supplier.name}"></td>
        <td th:text="${transaction.transactionType}"></td>
        <td th:text="${transaction.quantity}"></td>
        <td>
            <a th:href="@{/transactions/{id}(id=${transaction.transactionId})}">
                <button>View</button>
            </a>
            <a th:href="@{/transactions/delete/{id}(id=${transaction.transactionId})}"
               onclick="return confirm('Are you sure you want to delete this transaction?');">
                <button>Delete</button>
            </a>
        </td>
    </tr>

</table>

</body>
</html>
