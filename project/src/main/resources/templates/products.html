<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Products</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">

</head>
<body>
<h1>Products</h1>

<a th:href="@{/products/add}">
    <button>Add Product</button>
</a>

<br><br>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Name</th>
        <th>SKU</th>
        <th>Category</th>
        <th>Suppliers</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.productId}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.sku}"></td>
        <td th:text="${product.category.name}"></td>
        <td th:text="${suppliersByProduct.get(product.productId)}"></td>
        <td th:text="${product.price}"></td>
        <td th:text="${quantities.get(product.productId)}"></td>

        <td>
            <a th:href="@{/products/edit/{id}(id=${product.productId})}">
                <button>Edit</button>
            </a>

            <a th:href="@{/products/delete/{id}(id=${product.productId})}"
               onclick="return confirm('Are you sure you want to delete this product?');">
                <button>Delete</button>
            </a>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
