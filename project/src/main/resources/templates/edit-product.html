<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Product</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<h1>Edit Product</h1>

<form th:action="@{/products/update/{id}(id=${product.productId})}"
      th:object="${product}"
      method="post">

    <label>Name:</label><br>
    <input type="text" th:field="*{name}" required>
    <br><br>

    <label>SKU:</label><br>
    <input type="text" th:field="*{sku}" required>
    <br><br>

    <label>Price:</label><br>
    <input type="number"
           step="0.01"
           th:field="*{price}"
           required>
    <br><br>

    <label>Category:</label><br>
    <select th:field="*{category}">
        <option th:each="category : ${categories}"
                th:value="${category.categoryId}"
                th:text="${category.name}">
        </option>
    </select>
    <br><br>

    <button type="submit">
        Update Product
    </button>

</form>

<br>

<a th:href="@{/products}">
    <button>Back</button>
</a>

</body>
</html>
